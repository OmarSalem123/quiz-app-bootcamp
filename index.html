<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اختبار JavaScript</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <main class="quiz">
    <section id="start-screen" class="screen">
      <h1>اختبار JavaScript</h1>
      <p>عشرة أسئلة من الجلسات 13 إلى 17. عندك 15 ثانية لكل سؤال.</p>
      <p id="best" class="best"></p>
      <button id="start-btn" class="primary">ابدأ الاختبار</button>
    </section>

    <section id="quiz-screen" class="screen" hidden>
      <div class="bar">
        <span id="progress"></span>
        <span id="score"></span>
        <span id="timer" class="timer"></span>
      </div>
      <h2 id="question"></h2>
      <pre id="code" class="code" dir="ltr" hidden></pre>
      <ul id="options" class="options"></ul>
      <p id="feedback" class="feedback"></p>
      <button id="next-btn" class="primary" hidden>السؤال التالي</button>
    </section>

    <section id="done-screen" class="screen" hidden>
      <h2>خلص الاختبار</h2>
      <p id="final" class="final"></p>
      <p id="best-done" class="best"></p>
    </section>
  </main>
</body>
</html>
